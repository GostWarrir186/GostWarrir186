name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#d52b1e&color_dots=#ebedf0,#ffe58a,#f8c300,#00873e,#005a2b
            dist/snake-dark.svg?palette=github-dark&color_snake=#f8c300&color_dots=#1f1440,#5c1a1a,#d52b1e,#00873e,#f8c300

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
